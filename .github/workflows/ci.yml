name: Validate Specsplice domain and prototype
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'ordito/docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'ordito/docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ordito-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            ordito/runtime/package-lock.json
            ordito/code-import/package-lock.json
            ordito/ai/package-lock.json
      - run: npm run ordito:setup:test
      - run: npm --prefix ordito/prototype run check
      - run: npm --prefix ordito/prototype test
      - run: npm --prefix ordito/runtime ci --ignore-scripts
      - run: npm --prefix ordito/code-import ci --ignore-scripts
      - run: npm --prefix ordito/ai ci --ignore-scripts
      - run: node --test "ordito/test/*.test.{mjs,ts}"
  code-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            ordito/runtime/package-lock.json
            ordito/code-import/package-lock.json
            ordito/ai/package-lock.json
      - run: npm --prefix ordito/runtime ci --ignore-scripts
      - run: npm --prefix ordito/code-import ci --ignore-scripts
      - run: npm --prefix ordito/ai ci --ignore-scripts
      - run: npm --prefix ordito/runtime run check
      - run: npm --prefix ordito/runtime test
      - run: npm --prefix ordito/code-import run check
      - run: npm --prefix ordito/code-import test
      - run: npm --prefix ordito/ai run check
      - run: npm --prefix ordito/ai test
