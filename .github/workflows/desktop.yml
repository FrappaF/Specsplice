name: Specsplice desktop
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'ordito/docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'ordito/docs/**'
  workflow_dispatch:
    inputs:
      include_macos:
        description: Run the complete macOS suite alongside Linux
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Keep every desktop check on Linux; opt into macOS from Run workflow.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_macos && '["ubuntu-24.04","macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NODE_USE_ENV_PROXY: '1'
      FOUNDRY_LOCAL_SKIP_INSTALL: '1'
      GOMEMLIMIT: 3GiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test npm network retries
        run: node --test build/lib/test/npmNetworkRetry.test.ts
      - name: Verify macOS arm64 toolchain
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          xcode-select -p
          xcrun --find clang
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libkrb5-dev libsecret-1-dev libgtk-3-dev libgbm-dev libnss3 libasound2-dev xvfb
      - name: Prepare headers before native dependency scripts
        run: node build/npm/preinstall.ts
      - run: npm ci
      - run: npm run ordito:test
      - name: Check Specsplice TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run ordito:check
      - name: Build desktop client
        run: npm run build-fast -- --client-only
      - name: Test packaged diagram tools and draft preview
        run: node --test ordito/ai/test/packaged-diagrams.integration.mjs
      - name: Smoke Specsplice packaged AI workflow with a simulated CLI
        run: node ordito/scripts/smoke-ai.mjs
      - name: Test Specsplice AI controller with injected services
        run: node ordito/scripts/test-ai-service.ts
      - name: Test Specsplice CLI executable lookup and account status
        run: node test/unit/node/index.js --run src/vs/workbench/contrib/ordito/test/node/orditoCliExecutable.test.ts --run src/vs/workbench/contrib/ordito/test/node/orditoCliAccount.test.ts
      - name: Test Specsplice project lifecycle
        run: node test/unit/node/index.js --run src/vs/workbench/contrib/ordito/test/browser/orditoProjectService.test.ts --run src/vs/workbench/contrib/ordito/test/browser/workingCopyRecovery.test.ts --run src/vs/workbench/contrib/ordito/test/browser/orditoAccessibleContent.test.ts --run src/vs/workbench/contrib/ordito/test/browser/orditoBehaviorEditing.test.ts --run src/vs/workbench/contrib/ordito/test/browser/orditoStartup.test.ts
      - name: Typecheck production sources
        run: node node_modules/@typescript/native/bin/tsc --project ordito/tsconfig.production.json --pretty false
      - name: Build bundled extensions
        run: npm run gulp transpile-extensions compile-extension-media
      - name: Build upstream Copilot extension
        run: npm run compile-copilot
      - name: Prepare Electron from cached download archives
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          save-cache: 'true'
      - name: Native Specsplice AI orchestration tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ./scripts/test.sh --no-sandbox --run src/vs/workbench/contrib/ordito/test/electron-browser/orditoAiService.test.ts --run src/vs/workbench/contrib/ordito/test/electron-browser/orditoCodeService.test.ts
      - name: Native Specsplice AI orchestration tests on macOS
        if: runner.os == 'macOS'
        run: ./scripts/test.sh --run src/vs/workbench/contrib/ordito/test/electron-browser/orditoAiService.test.ts --run src/vs/workbench/contrib/ordito/test/electron-browser/orditoCodeService.test.ts
      - name: Native Specsplice AI workflow with simulated CLI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --ai-only
      - name: Native Specsplice AI workflow with simulated CLI on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --ai-only
      - name: Native manual-feedback regression on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --followup-only
      - name: Native manual-feedback regression on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --followup-only
      - name: Native visual workbench smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --native-only
      - name: Native visual workbench smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --native-only
      - name: Keyboard, narrow window and theme smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --ux-only
      - name: Keyboard, narrow window and theme smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --ux-only
      - name: Semantic navigation smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --navigation-only
      - name: Semantic navigation smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --navigation-only
      - name: Sequence diagram smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --sequence-only
      - name: Sequence diagram smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --sequence-only
      - name: State diagram smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --state-only
      - name: State diagram smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --state-only
      - name: Model impact smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --impact-only
      - name: Model impact smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --impact-only
      - name: Independent projects smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --projects-only
      - name: Independent projects smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --projects-only
      - name: Semantic diagram workflow on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --diagram-workflow
      - name: Semantic diagram workflow on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --diagram-workflow
      - name: Native code bridge smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --code-only
      - name: Native code bridge smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --code-only
      - name: Prototype Extension Host smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node ordito/scripts/smoke-desktop.mjs --extension-only
      - name: Prototype Extension Host smoke on macOS
        if: runner.os == 'macOS'
        run: node ordito/scripts/smoke-desktop.mjs --extension-only
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: .build/ordito-smoke
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
