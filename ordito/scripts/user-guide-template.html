<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="@@DESCRIPTION@@"><title>@@TITLE@@</title><style>
:root{color-scheme:light;--ink:#1c2b36;--muted:#52636e;--accent:#12627c;--line:#d9e1e4;--paper:#fff;--tint:#f1f6f8}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 system-ui,-apple-system,sans-serif}a{color:var(--accent);text-underline-offset:3px}a:hover{color:#053749}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #d78b20;outline-offset:4px}button,input{font:inherit}header{padding:28px 42px;border-bottom:1px solid var(--line);background:var(--tint)}header b{font-size:20px;letter-spacing:.06em}header span{display:block;color:var(--muted);font-size:14px}#layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1560px;margin:auto}aside{height:100vh;position:sticky;top:0;overflow:auto;border-right:1px solid var(--line);padding:24px 18px;background:#f8fafb;font-size:14px}aside label{font-weight:650;display:block;margin-bottom:7px}#search{width:100%;padding:9px;border:1px solid #a7b5be;border-radius:5px;background:white}#results{min-height:25px;color:var(--muted);font-size:13px}.toc-group{margin:10px 0;border-top:1px solid var(--line);padding-top:9px}.toc-group summary{cursor:pointer;font-weight:650;line-height:1.4;padding:4px}.toc-group ul{list-style:none;padding-left:8px;margin:8px 0}.toc-group li{margin:0}.toc-group a{display:block;padding:5px 4px;line-height:1.4;text-decoration:none}.toc-group a:hover{background:#e6eef2;border-radius:3px}#index>summary{font-size:18px;font-weight:650;cursor:pointer;margin-bottom:10px}main{min-width:0;padding:40px clamp(22px,5vw,80px) 90px;max-width:1160px}h1,h2,h3,h4{line-height:1.2;letter-spacing:-.015em}h1{font-size:clamp(34px,4vw,52px);margin:0 0 24px}h2{font-size:31px;margin:70px 0 24px;padding-top:25px;border-top:3px solid var(--accent);color:#114a60}h3{font-size:25px;margin:50px 0 20px}h4{font-size:20px;margin:30px 0 14px;color:#234f61}p{margin:0 0 18px}li{margin:8px 0}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;margin:24px 0;overflow-wrap:anywhere}th,td{padding:12px 13px;border:1px solid var(--line);text-align:left;vertical-align:top}th{background:#e9f1f4;color:#163c4b}tr:nth-child(even){background:#f8fafb}pre{background:#162d39;color:#f3f7fa;padding:20px;overflow:auto;border-radius:6px;font:14px/1.5 ui-monospace,monospace}code{font-size:.9em;overflow-wrap:anywhere}p code,li code,td code{background:#edf2f4;padding:2px 4px;border-radius:3px}figure{margin:26px 0}.image-zoom{border:1px solid var(--line);padding:0;display:block;width:100%;cursor:zoom-in;background:#111;border-radius:6px;overflow:hidden}.image-zoom img{display:block;max-width:100%;width:100%;height:auto}figcaption{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}blockquote{border-left:4px solid #a0bfcc;margin:22px 0;padding:6px 22px;color:#365360;background:var(--tint)}[hidden]{display:none!important}#empty{padding:20px;background:#fff3d6;border:1px solid #e5bd57}dialog{border:0;max-width:96vw;max-height:96vh;padding:12px;background:#17212a;border-radius:6px;color:white}dialog::backdrop{background:#000b}dialog img{display:block;max-width:90vw;max-height:82vh;object-fit:contain;margin:auto}dialog button{float:right;padding:7px 16px;margin:0 0 10px;border:1px solid #9aa8b0;border-radius:4px;cursor:pointer}footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:50px;padding-top:18px}.skip{position:fixed;top:-100px;left:12px;background:white;padding:12px;z-index:4}.skip:focus{top:12px}@media(max-width:860px){body{font-size:16px}header{padding:20px}#layout{display:block}aside{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 22px}#index{margin-top:10px}main{padding:30px 22px 65px}h2{font-size:27px}h3{font-size:23px}table{font-size:12px;table-layout:fixed}th,td{padding:8px 7px}figure{margin-left:-6px;margin-right:-6px}}@media print{header,aside,#empty{display:none}#layout{display:block}main{max-width:none;padding:0}h2,h3{break-after:avoid}.chapter{display:block!important}figure,table{break-inside:avoid}dialog{display:none}}
</style></head><body><a class="skip" href="#content">Skip to content</a><header><b>Specsplice / USER GUIDE</b><span>Order Shop tour · Marketplace workshop · Diagram atlas</span></header><div id="layout"><aside aria-label="Guide navigation"><label for="search">Search the guide</label><input id="search" type="search" placeholder="e.g. cardinality, returns, Sync"><div id="results" role="status" aria-live="polite"></div><details id="index"><summary>Contents</summary><nav aria-label="Chapters">@@TOC@@</nav></details></aside><main id="content"><p id="empty" hidden>No matching chapters.</p>@@CONTENT@@<footer>@@FOOTER@@</footer></main></div><dialog aria-label="Enlarged image"><button id="close-image">Close</button><img alt=""></dialog><script>
const index=document.getElementById('index'),wide=matchMedia('(min-width:861px)');index.open=wide.matches;wide.addEventListener('change',e=>index.open=e.matches);const query=document.getElementById('search'),sections=[...document.querySelectorAll('.chapter')],parts=[...document.querySelectorAll('.part')],result=document.getElementById('results');const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();query.addEventListener('input',()=>{const q=norm(query.value.trim());let count=0;for(const s of sections){s.hidden=!!q&&!norm(s.textContent).includes(q);if(!s.hidden)count++;}for(const p of parts){const children=[...p.querySelectorAll('.chapter')];p.hidden=!!q&&children.length>0&&children.every(s=>s.hidden);}document.getElementById('empty').hidden=!q||count>0;result.textContent=q?count+(count===1?' chapter found':' chapters found'):'';if(q){index.open=true;for(const g of document.querySelectorAll('.toc-group')){const links=[...g.querySelectorAll('li')];let found=false;for(const li of links){const target=document.getElementById(li.querySelector('a').hash.slice(1));const section=target?.closest('.chapter');li.hidden=!!section&&section.hidden;found ||= !!section&&!section.hidden;}g.open=found;}}else{for(const li of document.querySelectorAll('.toc-group li'))li.hidden=false;for(const g of document.querySelectorAll('.toc-group'))g.open=false;}});query.addEventListener('keydown',e=>{if(e.key==='Enter')sections.find(s=>!s.hidden)?.scrollIntoView({behavior:'smooth'});if(e.key==='Escape'){query.value='';query.dispatchEvent(new Event('input'));}});document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>{const target=document.getElementById(a.hash.slice(1));if(target?.closest('.chapter')?.hidden||target?.closest('.part')?.hidden){query.value='';query.dispatchEvent(new Event('input'));}}));const dialog=document.querySelector('dialog'),zoom=dialog.querySelector('img');let trigger;document.querySelectorAll('.image-zoom').forEach(b=>b.addEventListener('click',()=>{trigger=b;zoom.src=b.querySelector('img').src;zoom.alt=b.querySelector('img').alt;dialog.showModal();}));document.getElementById('close-image').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});dialog.addEventListener('close',()=>trigger?.focus());
</script></body></html>
